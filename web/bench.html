<!doctype html>

  article { max-width: 1000px; }
  td.num { text-align: right; font-family: var(--mono); }

<body>
<header><h1><a href="./">QTS</a> <small>renderer benchmark: JavaScript vs WebAssembly</small></h1></header>
<article>

<table id="table"><thead><tr><th>script</th><th>size</th><th>JS ms</th><th>wasm ms</th><th>wasm / JS</th><th>pixels</th></tr></thead><tbody></tbody></table>
